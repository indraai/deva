name: Tests

on:
	push:
		branches: [main]
	pull_request:
		branches: [main]
	workflow_dispatch:

permissions:
	contents: read

jobs:
	test:
		runs-on: ubuntu-latest
		strategy:
			matrix:
				node: [22, 24]
		steps:
			- uses: actions/checkout@v4
			- uses: actions/setup-node@v4
				with:
					node-version: ${{ matrix.node }}
			- run: npm test